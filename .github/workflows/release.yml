name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet and unit tests
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Cross-compile binaries
        run: |
          mkdir -p dist
          for target in "linux amd64" "linux arm64" "windows amd64" "darwin amd64" "darwin arm64"; do
            set -- $target
            os=$1
            arch=$2
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            out="dist/netdisk-${os}-${arch}${ext}"
            echo "Building ${out}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/server
          done
          (cd dist && sha256sum netdisk-* > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/netdisk-*
            dist/SHA256SUMS.txt
