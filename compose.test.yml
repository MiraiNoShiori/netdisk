# 独立验收环境，不复用开发数据库或数据卷。
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netdisk
      POSTGRES_PASSWORD: netdisk
      POSTGRES_DB: netdisk_test
    ports: ["127.0.0.1:15433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U netdisk -d netdisk_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    build:
      context: .
      dockerfile: deploy/Dockerfile.minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["127.0.0.1:19000:9000"]
    tmpfs: [/data]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
