<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Card background (readable on both GitHub light & dark themes) -->
  <rect x="0" y="0" width="960" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="32" y="34" font-size="15" font-weight="700" fill="#0f172a">NetDisk Architecture</text>
  <text x="200" y="34" font-size="12" fill="#64748b">Unidirectional Layers: handler / nfsgateway → service → repository / storage</text>

  <!-- Layer 1: Clients -->
  <g transform="translate(32, 54)">
    <rect x="0" y="0" width="206" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="103" y="24" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Embedded Web UI</text>
    <text x="103" y="42" text-anchor="middle" font-size="11" fill="#475569">go:embed · Zero-build HTML/JS</text>

    <rect x="230" y="0" width="206" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="333" y="24" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">HTTP / REST Clients</text>
    <text x="333" y="42" text-anchor="middle" font-size="11" fill="#475569">Range 206 · ZIP · Chunked · Share</text>

    <rect x="460" y="0" width="206" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="563" y="24" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">NFSv3 Clients</text>
    <text x="563" y="42" text-anchor="middle" font-size="11" fill="#475569">Linux mount -t nfs (vers=3)</text>

    <rect x="690" y="0" width="206" height="58" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
    <text x="793" y="24" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0369a1">WebRTC P2P Peers</text>
    <text x="793" y="42" text-anchor="middle" font-size="11" fill="#0369a1">Direct DataChannel · SDP only</text>
  </g>

  <!-- Arrows: Clients -> Server -->
  <line x1="135" y1="112" x2="135" y2="146" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="365" y1="112" x2="365" y2="146" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="595" y1="112" x2="595" y2="146" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="825" y1="112" x2="825" y2="146" stroke="#0284c7" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow-accent)"/>

  <!-- Layer 2: Go Server Container -->
  <rect x="32" y="148" width="896" height="202" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="46" y="168" font-size="11.5" font-weight="700" fill="#334155">cmd/server (Single Go Binary)</text>

  <!-- Transport Row -->
  <rect x="48" y="178" width="430" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="263" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">internal/handler + internal/middleware</text>
  <text x="263" y="213" text-anchor="middle" font-size="10.5" fill="#475569">chi Router · JWT / Refresh · Rate Limit · CORS · Safe Inline Preview</text>

  <rect x="494" y="178" width="212" height="44" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="600" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">internal/nfsgateway</text>
  <text x="600" y="213" text-anchor="middle" font-size="10.5" fill="#475569">go-nfs + billy · CIDR Allowlist</text>

  <rect x="722" y="178" width="190" height="44" rx="7" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.2"/>
  <text x="817" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#0369a1">P2P Signaling</text>
  <text x="817" y="213" text-anchor="middle" font-size="10.5" fill="#0369a1">30m Room · Offer/Answer</text>

  <!-- Arrows: Transport -> Service -->
  <line x1="263" y1="222" x2="263" y2="238" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="600" y1="222" x2="600" y2="238" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="817" y1="222" x2="817" y2="238" stroke="#0284c7" stroke-width="1.3" marker-end="url(#arrow-accent)"/>

  <!-- Service Row -->
  <rect x="48" y="240" width="864" height="40" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="480" y="257" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">internal/service</text>
  <text x="480" y="272" text-anchor="middle" font-size="10.5" fill="#1e40af">Files · Instant Dedup · Chunked Uploads · Shares &amp; Analytics · Trash &amp; Quota · Storage Migration · Background GC / Hot-Tiering</text>

  <!-- Arrows: Service -> Repo / Storage -->
  <line x1="257" y1="280" x2="257" y2="296" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="698" y1="280" x2="698" y2="296" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Repo & Storage Row -->
  <rect x="48" y="298" width="418" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="257" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">internal/repository</text>
  <text x="257" y="332" text-anchor="middle" font-size="10.5" fill="#475569">pgx/v5 · Raw SQL · Recursive CTE · Advisory Lock</text>

  <rect x="484" y="298" width="428" height="42" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="698" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">internal/storage</text>
  <text x="698" y="332" text-anchor="middle" font-size="10.5" fill="#475569">Streaming I/O · SHA-256 · Hybrid Local / S3 Router</text>

  <!-- Arrows: Server -> Persistence -->
  <line x1="257" y1="340" x2="257" y2="374" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="581" y1="340" x2="581" y2="374" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="815" y1="340" x2="815" y2="374" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Layer 3: Persistence & Storage -->
  <rect x="48" y="376" width="418" height="68" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.3"/>
  <text x="257" y="400" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">PostgreSQL 16</text>
  <text x="257" y="418" text-anchor="middle" font-size="10.5" fill="#854d0e">users · nodes · blobs · upload_sessions / parts</text>
  <text x="257" y="433" text-anchor="middle" font-size="10.5" fill="#854d0e">shares · share_access_logs · refresh_tokens · object_gc</text>

  <rect x="484" y="376" width="194" height="68" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="581" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">Local Filesystem</text>
  <text x="581" y="420" text-anchor="middle" font-size="10.5" fill="#047857">./data/blobs</text>
  <text x="581" y="434" text-anchor="middle" font-size="10.5" fill="#047857">Atomic temp + rename</text>

  <rect x="718" y="376" width="194" height="68" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.3"/>
  <text x="815" y="402" text-anchor="middle" font-size="12.5" font-weight="700" fill="#065f46">S3 / MinIO (Optional)</text>
  <text x="815" y="420" text-anchor="middle" font-size="10.5" fill="#047857">8 MiB Multipart Stream</text>
  <text x="815" y="434" text-anchor="middle" font-size="10.5" fill="#047857">5m Presigned Direct URL</text>

  <!-- Bidirectional migration arrow between Local and S3 -->
  <line x1="678" y1="410" x2="718" y2="410" stroke="#059669" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="698" y="402" text-anchor="middle" font-size="9.5" font-weight="600" fill="#065f46">Tier</text>
</svg>
