<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NetDisk · 文件分享</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="standalone-shell">
      <div class="standalone-header">
        <div>
          <span class="brand-badge">NETDISK · SHARED LINK</span>
          <h1 id="share-title">正在打开分享…</h1>
        </div>
        <a href="/" class="button-link">返回我的网盘 →</a>
      </div>

      <!-- 提取码解锁卡片 -->
      <div id="unlock-card" class="card" hidden style="max-width: 440px; margin: 24px auto;">
        <h3 style="margin-top: 0;">🔒 此分享受提取码保护</h3>
        <p class="muted">请输入分享者提供的提取码以浏览和下载文件。</p>
        <form id="unlock-form">
          <div class="field">
            <input id="share-pw" type="password" required placeholder="输入提取码" />
          </div>
          <button style="width: 100%;">验证并打开</button>
        </form>
        <p id="unlock-error" class="muted" style="color: var(--danger); margin-bottom: 0;"></p>
      </div>

      <!-- 内容浏览卡片 -->
      <div id="content-card" class="card" hidden>
        <div class="toolbar">
          <div id="share-crumbs" class="breadcrumbs"></div>
          <div id="share-meta" class="muted"></div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>名称</th>
                <th>大小</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="share-rows"></tbody>
          </table>
        </div>
      </div>

      <div id="error-card" class="card" hidden>
        <p id="error-msg" style="color: var(--danger); margin: 0;"></p>
      </div>
    </div>

    <div id="modal-root" class="modal-backdrop" hidden></div>
    <script type="module" src="/share.js"></script>
  </body>
</html>
